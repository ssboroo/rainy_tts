name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install media tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Python tests including POSIX storage bootstrap
        run: python -m unittest discover -s tests
      - name: Browser script validation
        run: |
          node --check app/static/app.js
          node --check app/static/reception.js
          node --check app/static/reception-knowledge.js
          node --check app/static/appointment.js
          node --check app/static/reception-launch.js
          node --check app/static/reception-visual.js
          node --test tests/*.cjs
      - name: Verify production image
        run: docker build -t rainy-voice:ci .
